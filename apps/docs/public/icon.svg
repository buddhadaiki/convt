<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same geometry and colors as the Mark component in src/components/logo.tsx. -->
  <style>
    .source { fill: #0a0a0a }
    .top { stop-color: #6092ff } .bottom { stop-color: #325ec7 }
    .overlap { fill: #244698 }
    @media (prefers-color-scheme: dark) {
      .source { fill: #eeeef0 }
      .top { stop-color: #6595ff } .bottom { stop-color: #4c82ff }
      .overlap { fill: #a5c3ff }
    }
  </style>
  <defs>
    <clipPath id="source"><rect x="2" y="2" width="19" height="19" rx="5"/></clipPath>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop class="top" offset="0"/><stop class="bottom" offset="1"/>
    </linearGradient>
  </defs>
  <rect class="source" x="2" y="2" width="19" height="19" rx="5"/>
  <rect x="11" y="11" width="19" height="19" rx="5" fill="url(#brand)"/>
  <rect class="overlap" x="11" y="11" width="19" height="19" rx="5" clip-path="url(#source)"/>
</svg>
